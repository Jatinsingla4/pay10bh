# Security gate — enforces the patch policy from the code itself.
# Runs on every PR and push to master, and weekly. Fails the build if any
# HIGH or CRITICAL CVE is present with no patch applied. This travels with
# the repo, so anyone who hosts it on GitHub gets the same enforcement.
name: security-audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC — catches newly disclosed CVEs

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      # Blocks the build on any high/critical CVE. Moderate/low only warn.
      - run: npm audit --audit-level=high
